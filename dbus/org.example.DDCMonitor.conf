<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">

<busconfig>

    <policy user="root">
        <allow own="org.example.DDCMonitor"/>
        <allow send_destination="org.example.DDCMonitor"/>
        <allow receive_sender="org.example.DDCMonitor"/>
    </policy>

    <policy context="default">
        <allow send_destination="org.example.DDCMonitor"/>
        <allow receive_sender="org.example.DDCMonitor"/>
    </policy>

</busconfig>
